[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "s3lobby"
dynamic = ["version"]
description = "Lobby server for the online lobby of the original The Settlers III"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DaRealHansForSure" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["settlers", "settlers-3", "lobby", "server", "retro-gaming", "mysql", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]

[project.optional-dependencies]
# The web interface (s3lobby web); the lobby server itself needs nothing beyond the standard library.
web = ["flask>=3.0"]
# MySQL or MariaDB instead of the SQLite file (--database mysql://...). The rsa extra lets PyMySQL
# log on with caching_sha2_password, MySQL 8's default, over a connection without TLS.
mysql = ["pymysql[rsa]>=1.1"]

[project.scripts]
s3lobby = "s3lobby.cli:main"

[tool.setuptools]
packages = ["s3lobby", "s3lobby.backends", "s3lobby.schema", "s3lobby.web"]

[tool.setuptools.package-data]
"s3lobby.schema" = ["sqlite/*.sql", "mysql/*.sql"]
"s3lobby.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/*"]

[tool.setuptools.dynamic]
version = { attr = "s3lobby.__version__" }
