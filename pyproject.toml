[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "s3lobby"
dynamic = ["version"]
description = "Lobby server for the online lobby of the original The Settlers III"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["settlers", "settlers-3", "lobby", "server", "retro-gaming"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]

[project.optional-dependencies]
# The web interface (s3lobby web); the lobby server itself needs nothing beyond the standard library.
web = ["flask>=3.0"]

[project.scripts]
s3lobby = "s3lobby.cli:main"

[tool.setuptools]
packages = ["s3lobby", "s3lobby.web"]

[tool.setuptools.package-data]
"s3lobby.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.dynamic]
version = { attr = "s3lobby.__version__" }
